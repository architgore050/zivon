{% extends "base.html" %}
{% block main %}
<section class="wrap page-head" aria-labelledby="error-title">
  <p class="kicker">Error {{ status_code }}</p>
  <h1 id="error-title">{{ error_title }}</h1>
  {% if error_text %}<p class="lede">{{ error_text }}</p>{% endif %}

</section>
{% endblock %}
