<section class="wrap band" aria-labelledby="sync-title" data-progress-sync hidden>
  <div class="section-head">
    <p class="kicker">On this device</p>
    <h2 id="sync-title">Bring your reading into your account?</h2>
  </div>
  <p class="lede" data-sync-summary></p>
  <p class="sync-actions">
    <button class="btn" type="button" data-sync-merge>Bring them in</button>
    <button class="btn btn--quiet" type="button" data-sync-dismiss>Not now</button>
  </p>
  <p class="meta" data-sync-status role="status" aria-live="polite"></p>
  <p class="meta">Your device copy stays where it is. Nothing is deleted by this step.</p>
</section>
