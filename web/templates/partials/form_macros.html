{% macro csrf(token) -%}
{{ csrf_field(token) }}
{%- endmacro %}

{% macro field_error(message, id) -%}
{% if message %}<p class="field-error" id="{{ id }}">{{ message }}</p>{% endif %}
{%- endmacro %}

{% macro form_error(message) -%}
{% if message %}<div class="notice notice--error" role="alert"><p>{{ message }}</p></div>{% endif %}
{%- endmacro %}
