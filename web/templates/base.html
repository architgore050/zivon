<!doctype html>
<html lang="{{ page_lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ page_title }} · Zivon</title>
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="{{ csp_meta|safe }}">
{% if csrf_token %}<meta name="csrf-token" content="{{ csrf_token }}">{% endif %}
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/BricolageGrotesque-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/CourierPrime-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/product.css">
{% block head %}{% endblock %}
</head>
<body class="shell shell--{{ shell_kind }}">
<a class="skip" href="#main">Skip to content</a>
{% include "partials/site_header.html" %}
<main id="main">
{% include "partials/messages.html" %}
{% block main %}{% endblock %}
</main>
{% include "partials/site_footer.html" %}
<script src="/assets/product.js" defer></script>
</body>
</html>
