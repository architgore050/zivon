# Zivon frontend site config - installed into nginx conf.d/default.conf.
# Served by nginxinc/nginx-unprivileged (non-root, listens on 8080).
#
# One html root, one config, local and cluster identical: the hand-maintained
# shell (index.html, assets/) is baked into the image and seeded into the
# root; generated pipeline output (courses/, courses.js) arrives at runtime
# on a mounted volume (compose) or PVC (cluster) at the same root.

# Demo freshness beats cache cleverness: HTML and the generated course index
# are never cached (a pipeline re-run must show immediately on demo day);
# everything else revalidates in 5 minutes; narration audio is immutable
# (its content-hash address IS the cache key, ST-04).
map $uri $zivon_cache_control {
    default             "public, max-age=300";
    "~*\.(js|css)$"     "no-cache";    # revalidate: a stale zivon.js is a broken page
    "~*\.html$"         "no-store";
    "~*/$"              "no-store";   # directory URLs serve index.html
    "= /courses.js"     "no-store";
    "~^/audio/"         "public, max-age=31536000, immutable";
}

# Audio-family rate limit (backend-spec ST-04, founder correction 3):
# per-IP token bucket, shared by every /audio/ location. 30 r/m with burst 15
# lets one reader press play on every block of a page in one go while
# throttling scripted scraping; the numbers are a founder calibration item.
limit_req_zone $binary_remote_addr zone=zivon_audio:1m rate=30r/m;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    autoindex off;

    error_page 404 /404.html;

    # Site-wide headers. Generated topic pages carry their own stricter meta
    # CSP; this covers the landing page and catches any page whose meta went
    # missing. add_header repeats are required by nginx per-location semantics.
    #
    # connect-src 'none' is the DEFAULT for every non-lesson page. Lesson pages
    # opt into the same-origin voice WS via the `location ^~ /courses/` block
    # below, which repeats the full header set with connect-src 'self' (the
    # founder-authorised scoped relaxation; docs/specs/frontend/
    # ws-client-contract.md §8). See also /voice/ (the WS proxy).
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control $zivon_cache_control always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Probe endpoint for the K8s deployment (plain 200, not a page).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # ST-04: pre-generated narration audio
    # /audio/{course_id}/{block_id}.{lang}.{content-hash}.opus
    # Immutable content-hash addresses -> the map above gives them a
    # year-long immutable cache; per-IP audio rate limit (see the zone).
    # The static module serves byte ranges (206) for scrubbing for free.
    # No add_header here: this location must INHERIT the server-level
    # headers (CSP, nosniff, referrer, Cache-Control) - nginx drops
    # inherited add_headers the moment a location declares its own.
    location /audio/ {
        limit_req zone=zivon_audio burst=15 nodelay;
        types {
            audio/opus opus;   # RFC 7845 section 9.1: .opus is audio/opus
        }
        default_type audio/opus;
        try_files $uri =404;
    }

    # Voice loop (ADR-0020): the dock dials the SAME origin, so the page's
    # `wss://<origin>/voice/ws` is proxied here to the core-backend monolith
    # (FastAPI, :8000). Compose and cluster use the identical upstream name:
    # compose gives the backend service the network alias `core-backend`; in
    # the cluster the short name resolves via the pod's search domain. Do not
    # fork this file between compose and cluster.
    # No add_header here on purpose: this location INHERITS the server-level
    # security headers (CSP etc.) — nginx drops inherited add_headers as soon
    # as a location declares its own.
    location /voice/ {
        proxy_pass http://core-backend:8000;
        proxy_http_version 1.1;
        # WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # $http_host (not $host) preserves the port: the server's same-origin
        # check compares the browser Origin netloc against Host, and `$host`
        # drops :8081, which would 1008 every localhost connection.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A tutor turn (STT + brain stream + TTS) can legitimately run past a
        # default 60 s proxy timeout; the server's own keepalive reaps dead
        # sockets. Buffering off so streamed TTS frames are not held.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # Lesson pages opt into the same-origin voice WS (`connect-src 'self'`);
    # every other location keeps the server-level `connect-src 'none'`. Because
    # nginx does not inherit add_header into a location that declares any, the
    # full header set is repeated here verbatim (founder-authorised scoped
    # relaxation — docs/specs/frontend/ws-client-contract.md §8).
    location ^~ /courses/ {
        add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control $zivon_cache_control always;
        try_files $uri $uri/ =404;
    }

    # Privacy summary page (SCR-PRIV-01): "Clear my data" must reach the same
    # origin (POST /v1/data/challenge -> DELETE /v1/data). It is not a lesson
    # page, so it needs its own explicitly scoped `connect-src 'self'`; every
    # other non-lesson location keeps the server-level `connect-src 'none'`.
    # No media-src relaxation: the page fetches JSON only, no audio/video.
    # The full header set is repeated here for the same nginx add_header
    # inheritance reason as /courses/ (see above); the page meta CSP mirrors it.
    location ^~ /privacy/ {
        add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control $zivon_cache_control always;
        try_files $uri $uri/ =404;
    }

    # Backend REST surface (session bootstrap, consent, reports, events,
    # privacy deletion). Same upstream name as /voice/ — compose alias /
    # k8s Service. No add_header: inherit the server-level security headers.
    location /v1/ {
        proxy_pass http://core-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location /api/ {
        proxy_pass http://core-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
