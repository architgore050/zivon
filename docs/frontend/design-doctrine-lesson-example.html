<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zivon: Field Notes lesson page</title>
<!-- Doctrine v1.3: typed page (Courier Prime body on the ruled lines), handwritten accents
only (Caveat title/diagram labels, pen underlines, annotation arrows); clean geometry;
strict 36 px rhythm; frame-tested 360-1280 px. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Courier+Prime:wght@400;700&family=Caveat:wght@500;700&family=Kalam:wght@400;700&display=swap">
<style>
:root{--paper:#EFE6B8;--paper-light:#F6F0CF;--ink:#1C1B18;--graphite:#5A5748;--pen-blue:#1F3A9E;
--display:"Bricolage Grotesque",Arial,sans-serif;--notes:"Courier Prime","Courier New",monospace;--hand:Caveat,Kalam,"Segoe Print","Bradley Hand",cursive}
html{height:100%}
body{margin:0;min-height:100%;background-color:var(--paper);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 34px,rgba(90,87,72,.4) 34px,rgba(90,87,72,.4) 36px);color:var(--ink);font-family:var(--display);overflow-x:hidden}
:focus-visible{outline:3px solid var(--pen-blue);outline-offset:3px}
.bar{position:fixed;top:0;left:0;right:0;z-index:10;background:var(--paper-light);border-bottom:1px solid var(--ink);padding-top:env(safe-area-inset-top,0px)}
.in{max-width:1100px;margin:0 auto;padding:8px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lab{font:400 14px var(--notes)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:500 15px var(--display);padding:8px 14px;min-height:40px;border-radius:2px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.chip[aria-checked=true]{background:var(--ink);color:var(--paper-light)}
.page{max-width:1100px;margin:0 auto;padding:108px 24px 72px;box-sizing:border-box}
.day{font:700 15px/36px var(--notes)}
h1.t{font:700 clamp(46px,7vw,76px)/72px var(--hand);margin:0 0 36px;position:relative}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:36px 48px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
/* doctrine v1.3 (4 Nov 2026): typed page, handwritten accents - body text is
   typed Courier Prime ON the ruled lines; Caveat survives on titles and diagram
   labels; every block is a multiple of 36 px so the rules stay under the text at
   every frame (360 px phone -> laptop). */
.body{font:400 17px/36px var(--notes);max-width:46ch}
.body p{margin:0 0 36px}
.key{position:relative;display:block;width:fit-content;font-weight:700}
.uline{position:absolute;top:100%;pointer-events:none}
figure{margin:0}
figcaption{font:400 14px/36px var(--notes);color:var(--graphite)}
.dia{display:block;width:100%;height:288px}
.dia text{font-family:var(--hand);font-weight:700;fill:var(--ink)}.dia .pb{fill:var(--pen-blue)}
/* paper card: taped on, flat, no shadow, no tilt */
.card{position:relative;background:var(--paper-light);border:1px solid var(--ink);border-radius:2px;padding:17px 18px;margin:36px 0}
.card::before{content:"";position:absolute;top:-13px;left:calc(50% - 46px);width:92px;height:27px;background:rgba(196,174,104,.5);transform:rotate(-3deg);clip-path:polygon(0 0,100% 0,96% 12%,100% 25%,96% 37%,100% 50%,96% 62%,100% 75%,96% 87%,100% 100%,0 100%,4% 87%,0 75%,4% 62%,0 50%,4% 37%,0 25%,4% 12%)}
.card:nth-of-type(2)::before{left:calc(50% - 38px);width:84px;transform:rotate(2deg)}
input[type=range]{width:100%;accent-color:var(--pen-blue);height:32px;margin:2px 0}
.card .lab{line-height:36px}.card .chip{min-height:36px}
/* sim box: fixed 180 px (5 ruled rows) so card height never depends on width */
.sim{width:100%;max-width:340px;height:180px;display:block}.sim text{font:500 12px var(--display)}
.read{font:700 16px/36px var(--notes)}
.q{font:500 17px/36px var(--display);margin:0 0 36px;max-width:60ch}
.fb{font:500 15px/36px var(--display);min-height:36px;margin-top:36px}
</style>
</head>
<body>
<header class="bar"><div class="in"><span class="lab" id="langlab"></span><div class="row" role="radiogroup" id="langs" aria-label="Language"></div></div></header>
<main class="page">
  <div class="day" id="day"></div>
  <h1 class="t" id="title"></h1>
  <div class="grid">
    <div>
      <div class="body" id="body"></div>
      <figure><svg class="dia" id="dia" viewBox="0 0 420 270" role="img"></svg><figcaption id="cap"></figcaption></figure>
    </div>
    <div>
      <section class="card"><label class="lab" for="ang" id="sl"></label>
        <input type="range" id="ang" min="0" max="80" value="40">
        <svg class="sim" id="sim" viewBox="0 0 320 180" role="img"></svg>
        <div class="read" id="read" aria-live="polite"></div></section>
      <section class="card"><div class="q" id="q"></div><div class="row" id="opts" role="radiogroup" aria-label="Answer options"></div><div class="fb" id="fb" aria-live="polite"></div></section>
    </div>
  </div>
</main>
<script>
const NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id);
const T={
en:{n:'English',ll:'Language',day:'Day 03 · Class 10 · Physics',title:'Reflection of light',
 p:['When light hits a smooth surface like a mirror, it bounces back. This is reflection.','Draw a line at right angles to the mirror. It is called the normal.','Measure both angles from the normal, never from the mirror.'],
 stmt:'The angle of incidence always equals the angle of reflection.',cap:'Clean geometry on the paper; labels handwritten.',
 dl:['normal','incident ray','reflected ray','mirror'],sl:'Angle of incidence',rd:['Incidence','Reflection'],
 q:'A ray hits the mirror at 30° to the normal. What is the angle of reflection?',ok:'Correct. Reflection angle = incidence angle = 30°.',no:'Not quite. The two angles are equal, so it is 30°.'},
hi:{n:'हिन्दी',ll:'भाषा',day:'दिन 03 · कक्षा 10 · भौतिकी',title:'प्रकाश का परावर्तन',
 p:['जब प्रकाश दर्पण जैसी चिकनी सतह पर पड़ता है, तो वह लौट जाता है। इसे परावर्तन कहते हैं।','दर्पण पर लंबवत एक रेखा खींचिए। इसे अभिलंब कहते हैं।','दोनों कोण अभिलंब से नापिए, दर्पण से कभी नहीं।'],
 stmt:'आपतन कोण हमेशा परावर्तन कोण के बराबर होता है।',cap:'साफ़ ज्यामिति; लेबल हाथ से लिखे गए।',
 dl:['अभिलंब','आपतित किरण','परावर्तित किरण','दर्पण'],sl:'आपतन कोण',rd:['आपतन','परावर्तन'],
 q:'एक किरण दर्पण पर अभिलंब से 30° पर गिरती है। परावर्तन कोण कितना है?',ok:'सही। परावर्तन कोण = आपतन कोण = 30°।',no:'अभी नहीं। दोनों कोण बराबर होते हैं, इसलिए 30°।'},
hx:{n:'Hinglish',ll:'Language',day:'Day 03 · Class 10 · Physics',title:'Light ka reflection',
 p:['Jab light mirror jaisi smooth surface par girti hai, toh wo wapas laut jaati hai. Ise reflection kehte hain.','Mirror par 90° ki ek line kheechiye. Ise normal kehte hain.','Dono angle normal se naapiye, mirror se kabhi nahi.'],
 stmt:'Angle of incidence hamesha angle of reflection ke barabar hota hai.',cap:'Clean geometry paper par; labels handwritten.',
 dl:['normal','incident ray','reflected ray','mirror'],sl:'Angle of incidence',rd:['Incidence','Reflection'],
 q:'Ek ray mirror par normal se 30° par girti hai. Angle of reflection kitna hoga?',ok:'Sahi. Reflection angle = incidence angle = 30°.',no:'Abhi nahi. Dono angle barabar hote hain, toh 30°.'}};
let lang='en';
function seedFrom(s){let h=2166136261>>>0;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
/* pen underline, doctrine 4.1 parameters (centerline baseline + 0.3em), drawn under the last line of the statement */
function pen(el){
 el.querySelectorAll('.uline').forEach(n=>n.remove());
 const fs=parseFloat(getComputedStyle(el).fontSize),text=el.textContent.trim(),r=document.createRange();r.selectNodeContents(el);
 const rs=r.getClientRects();if(!rs.length)return;const last=rs[rs.length-1],w=last.width,left=last.left-el.getBoundingClientRect().left;
 const pr=document.createElement('span');pr.style.cssText='display:inline-block;width:0;height:0';el.appendChild(pr);const yo=pr.getBoundingClientRect().bottom+.3*fs-el.getBoundingClientRect().bottom;pr.remove();
 const L=w+.27*fs,x0=-.09*fs,n=Math.max(4,Math.round(L/(.45*fs))),R=rng(seedFrom(text)),a=[],b=[];
 for(let i=0;i<=n;i++){const t=i/n,y=yo+.02*fs*Math.sin(2*Math.PI*(L*t)/(4*fs)+.7)+(R()*2-1)*.007*fs,h=(.067-.034*t)*fs/2;a.push([x0+L*t,y-h]);b.push([x0+L*t,y+h])}
 const d=a.concat(b.reverse()).map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+'Z';
 const s=document.createElementNS(NS,'svg');s.setAttribute('class','uline');s.setAttribute('aria-hidden','true');s.setAttribute('width',Math.ceil(w));s.setAttribute('height',Math.ceil(fs));s.setAttribute('overflow','visible');s.style.left=left+'px';
 s.innerHTML=`<path d="${d}" fill="#1F3A9E"/>`;el.appendChild(s)}
/* doctrine v1.3: geometry renders exactly as authored - clean straight polylines */
const cl=(p)=>'M'+p.map((q)=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join('L');
const st=(d,w,c,da)=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"${da?` stroke-dasharray="${da}"`:''}/>`;
function drawDia(){
 const P=[210,190],a=40*Math.PI/180,Lr=165,I=[P[0]-Lr*Math.sin(a),P[1]-Lr*Math.cos(a)],Rf=[P[0]+Lr*Math.sin(a),P[1]-Lr*Math.cos(a)],t=T[lang].dl;
 const hd=(tip,f)=>{const an=Math.atan2(tip[1]-f[1],tip[0]-f[0]),h=16;return[[tip[0]-h*Math.cos(an-.45),tip[1]-h*Math.sin(an-.45)],tip,[tip[0]-h*Math.cos(an+.45),tip[1]-h*Math.sin(an+.45)]]};
 const m1=[(I[0]+P[0])/2,(I[1]+P[1])/2],m2=[(Rf[0]+P[0])/2,(Rf[1]+P[1])/2];
 let s=st(cl([[30,190],[390,190]],3,2.2),3.8,'#1C1B18');
 for(let x=44;x<390;x+=22)s+=st(cl([[x,194],[x-12,208]],x,1.5),2.2,'#1C1B18');
 s+=st(cl([P,[210,38]],5,2),2.6,'#5A5748','7 8')+st(cl([I,m1,P],7,2.4),3.2,'#1C1B18')+st(cl(hd(m1,I),8,.8),3,'#1C1B18')+st(cl([P,m2,Rf],9,2.4),3.2,'#1C1B18')+st(cl(hd(Rf,m2),10,.8),3,'#1C1B18');
 const arc=(sgn)=>{const x=P[0]+sgn*56*Math.sin(a),y=P[1]-56*Math.cos(a);return `M210 134A56 56 0 0 ${sgn<0?0:1} ${x.toFixed(1)} ${y.toFixed(1)}`};
 s+=st(arc(-1),2.2,'#1F3A9E')+st(arc(1),2.2,'#1F3A9E');
 s+=`<text class="pb" x="176" y="124" font-size="28">i</text><text class="pb" x="226" y="124" font-size="28">r</text><text x="220" y="92" font-size="22">${t[0]}</text><text x="14" y="30" font-size="22">${t[1]}</text><text x="406" y="30" font-size="22" text-anchor="end">${t[2]}</text><text x="30" y="240" font-size="22">${t[3]}</text>`;
 $('dia').innerHTML=s;$('dia').setAttribute('aria-label',t.join(', '))}
function drawSim(){
 const th=+$('ang').value,a=th*Math.PI/180,P=[160,150],L=118,I=[P[0]-L*Math.sin(a),P[1]-L*Math.cos(a)],R=[P[0]+L*Math.sin(a),P[1]-L*Math.cos(a)],c='#1F3A9E',f='#1C1B18',t=T[lang];
 const ar=(q,fr)=>{const an=Math.atan2(q[1]-fr[1],q[0]-fr[0]),h=9;return`M${q[0]-h*Math.cos(an-.5)} ${q[1]-h*Math.sin(an-.5)}L${q[0]} ${q[1]}L${q[0]-h*Math.cos(an+.5)} ${q[1]-h*Math.sin(an+.5)}`};
 const m1=[(I[0]+P[0])/2,(I[1]+P[1])/2],m2=[(R[0]+P[0])/2,(R[1]+P[1])/2],ln=(x1,y1,x2,y2,col,w,d)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"${d?` stroke-dasharray="${d}"`:''}/>`;
 $('sim').innerHTML=ln(30,150,290,150,f,3)+ln(160,150,160,22,'#5A5748',1.5,'4 6')+ln(I[0],I[1],P[0],P[1],c,3)+`<path d="${ar(m1,I)}" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"/>`+
 ln(P[0],P[1],R[0],R[1],c,3,'9 6')+`<path d="${ar(R,m2)}" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"/><text x="30" y="172" fill="${f}">${t.dl[3]}</text>`;
 $('read').textContent=`${t.rd[0]}: ${th}°   ${t.rd[1]}: ${th}°`}
/* every text block is a multiple of 36px tall, so one measurement of the text baseline puts the ruled lines under every line of text; fit() re-runs on resize (frame adaptation) */
function fit(){
 const bar=document.querySelector('.bar'),pg=document.querySelector('.page');pg.style.paddingTop=Math.ceil((bar.offsetHeight+12)/36)*36+'px';
 const p=document.querySelector('.body p'),pr=document.createElement('span');pr.style.cssText='display:inline-block;width:0;height:0';p.prepend(pr);
 const b=pr.getBoundingClientRect().bottom-p.getBoundingClientRect().top;pr.remove();
 const y=p.getBoundingClientRect().top+scrollY;document.body.style.backgroundPosition='0 '+((((y+b-34)%36)+36)%36)+'px';
 const h=document.querySelector('h1.t'),hs=document.createElement('span');h.style.top='0px';hs.style.cssText='display:inline-block;width:0;height:0';h.prepend(hs);
 const bt=hs.getBoundingClientRect().bottom-h.getBoundingClientRect().top,hy=h.getBoundingClientRect().top+scrollY;hs.remove();
 let d=(((y+b)-(hy+bt))%36+36)%36;if(d>18)d-=36;h.style.top=d+'px'}
function after(){fit();document.querySelectorAll('.key,h1.t').forEach(pen)}
function render(){
 const t=T[lang];document.documentElement.lang=lang==='hi'?'hi':'en';
 $('langlab').textContent=t.ll;$('day').textContent=t.day;$('title').textContent=t.title;$('cap').textContent=t.cap;$('sl').textContent=t.sl;$('q').textContent=t.q;$('fb').textContent='';
 $('body').innerHTML=`<p>${t.p[0]}</p><p>${t.p[1]}</p><p class="key">${t.stmt}</p><p>${t.p[2]}</p>`;
 document.querySelectorAll('#langs .chip').forEach(b=>b.setAttribute('aria-checked',b.dataset.k===lang));
 $('opts').innerHTML=['30°','60°','90°'].map(o=>`<button class="chip" role="radio" data-o="${o}" aria-checked="false">${o}</button>`).join('');
 $('opts').querySelectorAll('button').forEach(b=>b.onclick=()=>{const ok=b.dataset.o==='30°';$('opts').querySelectorAll('button').forEach(x=>x.setAttribute('aria-checked',x===b));$('fb').textContent=(ok?'✓ ':'✗ ')+t[ok?'ok':'no']});
 drawDia();drawSim();after();(document.fonts?document.fonts.ready:Promise.resolve()).then(after)}
$('langs').innerHTML=Object.keys(T).map(k=>`<button class="chip" role="radio" data-k="${k}" aria-checked="false">${T[k].n}</button>`).join('');
$('langs').onclick=e=>{if(e.target.dataset.k){lang=e.target.dataset.k;render()}};
$('ang').oninput=drawSim;window.addEventListener('resize',after);if(document.fonts)document.fonts.onloadingdone=after;
render();
</script>
</body>
</html>
