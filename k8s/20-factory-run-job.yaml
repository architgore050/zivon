# A REAL pipeline run as a K8s Job — the pattern every future topic run follows.
#
# Prerequisites (this Job will fail without them):
#   1. ZIVON_BASE_URL + ZIVON_MODEL env below set to a reachable OpenAI-format
#      server (missing server env is a hard config error by design).
#      Dev setup: the inference router (docker compose up -d inference-router)
#      forwards 192.168.49.1:18080 -> the host's loopback-only server on :8080.
#   2. If your server needs an API key, create the Secret (never in a manifest):
#        kubectl create secret generic zivon-factory-env -n zivon \
#          --from-literal=ZIVON_API_KEY=<key>
#      Keyless local servers: the Secret is optional (see secretKeyRef below).
#
# Output: runs/ is an emptyDir = EPHEMERAL evidence (gone when the pod ends;
# for dev fetch it with:  kubectl cp zivon/<pod-name> runs -c factory).
# frontend/ is the zivon-frontend PVC: stage 11-link publishes generated pages
# straight onto the site the frontend Deployment serves (k8s/30, k8s/40).
# sources/ (PDF + text cache) lives on the zivon-sources PVC (k8s/13): fetched
# textbooks survive across runs, so NCERT is downloaded once, not every run.
# Apply order: 00 -> 10 -> 12 -> 13 -> 15 -> 20 -> 30 -> 40 (the PVCs from
# 12/13/15 must exist before this Job).
apiVersion: batch/v1
kind: Job
metadata:
  name: factory-run-motion        # one Job per topic run; name it descriptively
  namespace: zivon
  labels:
    app: zivon-factory
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 7200     # a pipeline run must not hang forever: hard cap. 2 h because a cold-cache first run politely fetches + extracts the whole catalog; the sources PVC makes progress resumable, so a re-run continues where this one stopped.
  ttlSecondsAfterFinished: 86400  # kube-linter gate: auto-clean the finished Job after 1 day
  template:
    metadata:
      labels:
        app: zivon-factory
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false   # the factory needs no K8s API access
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: factory
          image: zivon-factory:0.2.4
          imagePullPolicy: IfNotPresent
          # Command override: the image's CMD (smoke test) is replaced by the
          # real entry point. This is the Job-vs-smoke difference.
          command: ["python", "pipeline.py", "Motion", "--class", "9"]
          securityContext:
            readOnlyRootFilesystem: true   # kube-linter gate; all writes hit the mounts below
          env:
            - name: ZIVON_BASE_URL
              value: "http://192.168.49.1:18080/v1"   # dev router -> host inference server; EDIT ME for another server
            - name: ZIVON_MODEL
              value: "qwen3.8-flash-next-iq3_xxs"     # exactly as GET /v1/models reports; EDIT ME for another model
            - name: ZIVON_API_KEY
              valueFrom:
                secretKeyRef:
                  name: zivon-factory-env
                  key: ZIVON_API_KEY
                  optional: true   # keyless local servers need no Secret; hosted servers: create it
          volumeMounts:
            - name: runs
              mountPath: /app/runs
            - name: site
              mountPath: /app/frontend
            - name: sources
              mountPath: /app/sources/pdfs
              subPath: pdfs
            - name: sources
              mountPath: /app/sources/cache
              subPath: cache
            - name: hf-cache
              mountPath: /app/.cache/huggingface
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi         # full pipeline: torch + Chromium + model I/O. 4 Gi OOMKilled during ingest (2026-11-02): pdfplumber peaks hard on image-heavy NCERT pages; node has 32 Gi.
      volumes:
        - name: runs
          emptyDir: {}
        - name: site
          persistentVolumeClaim:
            claimName: zivon-frontend
        - name: sources
          persistentVolumeClaim:
            claimName: zivon-sources   # PDF + text cache persist across runs (k8s/13)
        - name: hf-cache
          persistentVolumeClaim:
            claimName: zivon-hf-cache   # embedder downloads once, not per run
        - name: tmp
          emptyDir: {}
