apiVersion: batch/v1
kind: CronJob
metadata:
  name: sync-nightly
  namespace: zivon
  labels:
    app: zivon-backend
    component: cold-sync
spec:
  schedule: "${SYNC_NIGHTLY_CRON_SCHEDULE}"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: zivon-backend
            task: sync-nightly
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
          containers:
            - name: sync-nightly
              image: zivon-backend:0.1.0
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "backend.sync", "sync-nightly"]
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              envFrom:
                - configMapRef:
                    name: zivon-voice-config
                - secretRef:
                    name: zivon-voice-env
                    optional: true
                - secretRef:
                    name: zivon-cold-writer
                    optional: true
              volumeMounts:
                - name: sources
                  mountPath: /app/runs
                  subPath: runs
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 150m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: sources
              persistentVolumeClaim:
                claimName: zivon-sources
            - name: tmp
              emptyDir: {}
---
