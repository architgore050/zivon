# Local dev runner for the content factory, core backend monolith, Postgres,
# and static frontend containers.
#
#   docker compose run --rm factory                                  # smoke test (default CMD)
#   docker compose run --rm factory python pipeline.py "Motion" --class 9
#   docker compose up -d postgres backend                            # boot core backend + Postgres 16
#   docker compose up web                                            # serve frontend/ on :8081
#
# Host port 8081 (not 8080): the dev machine's OpenAI-format inference server
# commonly lives on :8080 - the site must not fight it for the port.
# Volumes keep pipeline OUTPUT (runs/, generated pages in frontend/) on the
# host, and download caches (PDFs, text, HF models) warm between runs.
# frontend/ is mounted so generated pages survive the container's death.
services:
  # The llm-manager NODE: the isolated model-call service (llm_manager/ +
  # FastAPI, Dockerfile.llm-manager). The model-access point of the whole
  # system - the factory talks OpenAI chat-completions to THIS and this is
  # the only caller of the inference server:
  #   factory -> llm-manager -> (inference-router) -> host server
  llm-manager:
    build:
      context: .
      dockerfile: Dockerfile.llm-manager
    image: zivon-llm-manager:0.1.0
    environment:
      - ZIVON_BASE_URL=${ZIVON_NODE_UPSTREAM_URL:-${ZIVON_BASE_URL:-}}
      - ZIVON_MODEL=${ZIVON_MODEL:-}
      - ZIVON_API_KEY=${ZIVON_API_KEY:-}
    ports:
      - "127.0.0.1:18090:8000"
    restart: unless-stopped

  factory:
    build: .
    image: zivon-factory:0.3.22
    environment:
      - ZIVON_BASE_URL=${ZIVON_BASE_URL:-}
      - ZIVON_MODEL=${ZIVON_MODEL:-}
      - ZIVON_API_KEY=${ZIVON_API_KEY:-}
      - ZIVON_MAX_ATTEMPTS=${ZIVON_MAX_ATTEMPTS:-3}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./runs:/app/runs
      - ./frontend:/app/frontend
      - ./sources/pdfs:/app/sources/pdfs
      - ./sources/cache:/app/sources/cache
      - ./hf-cache:/app/.cache/huggingface

  # The admin DASHBOARD v0 (EX3-OBS): small FastAPI app over the log store +
  # runs/ artifacts, with the two trigger buttons (the same scripts). The
  # admin token is env-only (zivon-admin-auth Secret in-cluster); here it
  # comes from your shell. No DSN locally -> the JSONL fallback is the store
  # and the views say so honestly — it boots WITHOUT the admin secret and
  # WITHOUT the log store and still answers /healthz (fail-closed happens per
  # request: admin routes 503 + dashboard.auth_unconfigured). That is the
  # spec'd dev posture, not a bug. Deliberately NOT behind the dev-stack
  # profile: `docker compose up -d dashboard` keeps working exactly as before.
  #   docker compose up -d dashboard   # http://127.0.0.1:8082
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: zivon-dashboard:0.1.0
    environment:
      - ZIVON_ADMIN_TOKEN=${ZIVON_ADMIN_TOKEN:-}
      - ZIVON_LOG_DSN=${ZIVON_LOG_DSN:-}
      - ZIVON_ENV=${ZIVON_ENV:-dev}
      - ZIVON_LOG_LEVEL=${ZIVON_LOG_LEVEL:-INFO}
    ports:
      # 8082: distinct from the site's 8081 and the node's 18090.
      - "127.0.0.1:8082:8000"
    volumes:
      - ./runs:/app/runs:ro          # the dashboard never writes artifacts
    restart: unless-stopped

  # Dev-only inference router (docker/inference-router.Dockerfile): makes the
  # host's loopback-only OpenAI-format server reachable from containers and
  # minikube pods WITHOUT touching it.
  inference-router:
    build:
      context: .
      dockerfile: docker/inference-router.Dockerfile
    image: zivon-inference-router:0.1.0
    network_mode: host
    restart: unless-stopped

  # Hot database (U2, ADR-0001): PostgreSQL 16 for the core backend monolith.
  # Password passed from shell environment at runtime (never hardcoded).
  postgres:
    image: postgres:16.6-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-zivon}
      - POSTGRES_USER=${POSTGRES_USER:-zivon}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - POSTGRES_HOST_AUTH_METHOD=${POSTGRES_HOST_AUTH_METHOD:-trust}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - zivon-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-zivon} -d $${POSTGRES_DB:-zivon}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Core backend monolith (ADR-0005, Dockerfile.backend): FastAPI REST surface
  # (/v1/*, /v1/admin/*), credit guard, consent/identity, and voice mount seam.
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: zivon-backend:0.1.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ZIVON_ENV=${ZIVON_ENV:-dev}
      - ZIVON_DB_URL=${ZIVON_DB_URL:-postgresql://zivon@postgres:5432/zivon}
      - ZIVON_SESSION_TOKEN_KEY=${ZIVON_SESSION_TOKEN_KEY:-}
      - ZIVON_IP_HASH_SALT=${ZIVON_IP_HASH_SALT:-}
      - ZIVON_ADMIN_TOKEN=${ZIVON_ADMIN_TOKEN:-}
      - ZIVON_VOICE_BRAIN_TRANSPORT=${ZIVON_VOICE_BRAIN_TRANSPORT:-gemini-direct}
      - ZIVON_VOICE_BRAIN_MODEL=${ZIVON_VOICE_BRAIN_MODEL:-gemma-4-26b-a4b-it}
      - ZIVON_VOICE_GEMINI_API_KEY=${ZIVON_VOICE_GEMINI_API_KEY:-}
      - GNANI_PRISMA_API_KEY=${GNANI_PRISMA_API_KEY:-}
      - GNANI_TIMBRE_API_KEY=${GNANI_TIMBRE_API_KEY:-}
    ports:
      - "127.0.0.1:18085:8000"
    volumes:
      - ./runs:/app/runs:ro
    restart: unless-stopped

  # Static frontend hosting: nginx serving ./frontend (hand-maintained shell
  # + generated pages the factory writes into the same volume).
  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: zivon-frontend:0.1.5
    ports:
      - "8081:8080"
    volumes:
      - ./frontend:/usr/share/nginx/html

  # ---------------------------------------------------------------------------
  # Wave-E dev stack (EX6-CICD work item 4) — dev-only, OPT-IN.
  #
  #   docker compose --profile dev-stack up -d     # dev db (:5433) + evals runner
  #   docker compose --profile dev-stack run --rm evals-runner  # deterministic eval smoke
  #   docker compose --profile backend up -d       # db + core-backend (:8090) — needs Dockerfile.backend
  #
  # Every service below carries a profile, so the default `docker compose up`
  # / `compose run factory` behave EXACTLY as before the Wave-E work: profiled
  # services build/start only when their profile is enabled.
  #
  # `backend` deliberately has its OWN `backend` profile instead of riding
  # `dev-stack`: EX0's `Dockerfile.backend` has not landed yet, so including it
  # in `dev-stack` would make `--profile dev-stack up` fail at build time
  # today. `dev-stack` thus stays usable (db + evals-runner) while the backend
  # stack is an explicit opt-in that starts failing only for whoever asks for
  # it — and works the day the Dockerfile lands. The `db` service joins both
  # profiles because both consumers need it.
  #
  # Host ports stay out of the occupied range (8081 site, 18080 router, 18090
  # node): db 5433, backend 8090, bound to loopback only. The dashboard is NOT
  # profiled — it keeps its existing non-profiled service above (:8082), so
  # both documented commands stay true.
  #
  # Mock/dev posture: the backend boots on CONFIG-ONLY env (no product
  # secrets in compose — repo rule; real keys come from the shell at runtime,
  # same ${VAR:-} pattern as the factory service). The voice package's dev/
  # mock transport switches land with EX0/EX1 (spec §12: every knob has a
  # default, secrets from env) — until then this is a boot-and-probe stack,
  # not a talking tutor.
  db:
    # Dev Postgres 16 (backend-spec §12 — same major the cluster runs).
    # Profiled: the factory/llm-manager/web stack never touches it; shared by
    # the dev-stack (evals) and backend profiles.
    image: postgres:16-alpine
    profiles: ["dev-stack", "backend"]
    environment:
      - POSTGRES_USER=${DEV_DB_USER:-zivon}
      - POSTGRES_PASSWORD=${DEV_DB_PASSWORD:-zivon}
      - POSTGRES_DB=${DEV_DB_NAME:-zivon}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./runs/dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEV_DB_USER:-zivon}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # The core-backend monolith (voice/ mounts into it, ADR-0020 — no separate
  # voice service or image). Builds from EX0's Dockerfile.backend; own
  # `backend` profile until that lands (see the section comment above).
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: zivon-backend:0.1.0
    profiles: ["backend"]
    environment:
      # Dev DB: the compose `db` service (credentials are throwaway dev values).
      - ZIVON_DB_URL=postgresql://${DEV_DB_USER:-zivon}:${DEV_DB_PASSWORD:-zivon}@db:5432/${DEV_DB_NAME:-zivon}
      - ZIVON_ENV=dev
      # Voice knobs (spec §12 family): dummy transport config for dev boot;
      # no API key here on purpose — the tutor runs degraded/mock in dev.
      - ZIVON_VOICE_BRAIN_TRANSPORT=${ZIVON_VOICE_BRAIN_TRANSPORT:-gemini-direct}
      - ZIVON_VOICE_BRAIN_MODEL=${ZIVON_VOICE_BRAIN_MODEL:-gemma-4-26b-a4b-it}
      - ZIVON_VOICE_STT_URL=${ZIVON_VOICE_STT_URL:-}
      - ZIVON_VOICE_TTS_URL=${ZIVON_VOICE_TTS_URL:-}
    ports:
      - "127.0.0.1:8090:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Evals runner (EX4, spec §5): same factory image (evals rides in it —
  # k8s/52 runs the exact same command), profile-gated, no ports.
  evals-runner:
    build: .
    image: zivon-factory:0.3.17
    profiles: ["dev-stack"]
    command: ["python", "-m", "evals", "run", "--suite", "smoke", "--fail-on-regression"]
    environment:
      - ZIVON_BASE_URL=${ZIVON_BASE_URL:-}
      - ZIVON_MODEL=${ZIVON_MODEL:-}
      - ZIVON_API_KEY=${ZIVON_API_KEY:-}
    volumes:
      - ./runs:/app/runs
      - ./hf-cache:/app/.cache/huggingface

volumes:
  zivon-db-data:
