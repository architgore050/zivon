deterministic_checks:
- id: DET-SER01-BLUEPRINT-ALIGNMENT
  entrypoint: evals.checkers.exam_checks:check_blueprint_alignment
  severity_on_fail: fatal
  reuses_factory_rule: factory.exam.validators:validate_blueprint
  description: Rebuilds E2 from the ingest output and recomputes every weighted
    chapter mark from the raw question rows and the declared recency weights, so a
    blueprint that drifts from its own inputs fails. Asserts the chapter universe
    follows the syllabus, shares sum to 1, the section template equals the paper
    design (27 marks for the Class 10 Physics section, 70 for Class 12 Physics),
    the type mix covers every observed response mode, and the confidence block
    admits that the question-to-chapter map is authored rather than verified. A
    tampered chapter share must fail `blueprint.share_sum`.
