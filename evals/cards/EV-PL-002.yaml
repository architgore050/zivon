card_id: EV-PL-002
version: 1
title: RAG grounding, citation resolution, and honest fallbacks (PL2)
stage: PL2-retrieval
agent_role: Teaching Agent
suites:
- smoke
- full
- calibrate
golden_inputs:
  topics:
  - evals/goldens/personalized/rag-index
  - evals/goldens/personalized/sessions/class-10-light-weakness
  seeded_defects:
  - evals/goldens/personalized/judge-calibration/faithfulness/SD-PLJ-F01.json
  - evals/goldens/personalized/judge-calibration/faithfulness/SD-PLJ-F02.json
  - evals/goldens/personalized/judge-calibration/faithfulness/SD-PLJ-F03.json
  - evals/goldens/personalized/judge-calibration/faithfulness/SD-PLJ-C01.json
  - evals/goldens/personalized/judge-calibration/faithfulness/SD-PLJ-C02.json
  - evals/goldens/personalized/judge-calibration/faithfulness/SD-PLJ-C03.json
  source_catalog_ref: sources/catalog.json
deterministic_checks:
- id: DET-PL02-CITATIONS
  entrypoint: evals.checkers.personalized_checks:check_citations
  severity_on_fail: fatal
  reuses_factory_rule: backend.personalized.rag:resolve_citations
  description: For every golden teaching turn, each citation excerpt id exists in the turn's
    own retrieval scope, the stored label matches the chunk identity, zero resolved citations
    implies ungrounded=true, and unknown ids are dropped (never invented).
- id: DET-PL02-PROVENANCE
  entrypoint: evals.checkers.personalized_checks:check_provenance
  severity_on_fail: fatal
  reuses_factory_rule: backend.personalized.rag:RagIndex.load
  description: The golden index manifest matches its chunks (hash + count); every ncert chunk's
    page_from equals page_to and stays a positive page; no chunk carries an exam-paper source
    kind or user content; the tier is lesson only for lesson blocks.
- id: DET-PL02-SCOPE
  entrypoint: evals.checkers.personalized_checks:check_retrieval_scope
  severity_on_fail: fatal
  reuses_factory_rule: backend.personalized.rag:RagIndex.retrieve
  description: Scoped retrieval over the fixture index keeps every excerpt inside the queried
    concept scope or the chapter, honors the 4000-character excerpt budget, and assigns stable
    S1..Sn ids.
- id: DET-PL02-FALLBACK
  entrypoint: evals.checkers.personalized_checks:check_lexical_fallback
  severity_on_fail: fatal
  reuses_factory_rule: backend.personalized.rag:RagIndex.retrieve
  description: With the embedder unavailable, retrieval still returns excerpts via lexical
    scoring and marks the turn lexical_fallback; an empty index is ungrounded with no excerpts.
llm_judge:
  enabled_in_suites:
  - full
  - calibrate
  entrypoint: evals.judges.pl_judges:calibrate_pl_faithfulness
  reuses_prompt_from: backend.personalized.prompts:GROUNDING_LAW (the grounding law the teach prompt is
    built under; the faithfulness ladder is fixed by docs/specs/personalized-learning/evals.md section 3)
  severity_ladder:
    fatal: A teaching claim contradicted by its cited excerpt, or a fabricated page/section reference
      (a locator the citation does not carry). Must quote both the claim and the excerpt text.
    major: A factual claim with no citation and no support in the cited excerpts (the excerpts are the
      universe of the slice) that adds NEW domain knowledge — a law, definition, property, or
      relationship absent from every excerpt. Application of a cited law is never a finding — inside a
      worked example or exercise solution, the exercise's given values, the results derived by applying
      the cited law (numbers the excerpt need not print), and the standard conventions needed to apply
      it (e.g. angles measured from the normal) are correct teaching, not new facts.
    minor: A citation that supports only a weaker version of the claim; a plain-language analogy that
      illustrates a cited claim is acceptable and never a finding; method language and phrasing are
      never findings.
  way_out_rule: "Report unverifiable suspicions as severity='minor' with message starting 'unverified:' — never as fatal or major."
  anchor_examples:
  - label: "Fatal - Claim contradicted by its citation"
    input_summary: "Teaching says the angle of incidence is always greater than the angle of reflection; [S1] states the angles are equal."
    expected_issue:
      severity: fatal
      block_id: "t-1"
      category: "content"
      message: "Claim states 'always greater than'; cited excerpt [S1] states 'The angle of incidence is equal to the angle of reflection'."
  - label: "Major - Uncited factual claim"
    input_summary: "Teaching adds 'The focal length of a concave mirror is half its radius of curvature' with no citation and no such excerpt."
    expected_issue:
      severity: major
      block_id: "t-1"
      category: "content"
      message: "The focal-length claim ('half its radius of curvature') has no citation and no support in the cited excerpts."
  - label: "Minor - Weaker version supported"
    input_summary: "Teaching says 'the angles are always exactly equal for every mirror'; [S1] states it only for a plane mirror."
    expected_issue:
      severity: minor
      block_id: "t-1"
      category: "content"
      message: "The citation supports the claim for plane mirrors only - a weaker version of the stated claim."
thresholds:
  deterministic_pass_rate_min: 1.0
  fatal_issues_max: 0
  major_issues_max: 1
  recall_fatal_min: 1.0
  recall_blocking_min: 0.8
  specificity_clean_min: 1.0
  regression_drop_tolerance: 0.0
cost_budget:
  smoke_model_calls: 0
  full_model_calls_per_topic: 6
  calibration_model_calls_total: 6
  max_completion_tokens_per_call: 2000
  call_deadline_s: 600
