deterministic_checks:
- id: DET-SYN03-NUMERIC-RECOMPUTE
  entrypoint: evals.checkers.numeric_checks:check_numeric_recompute
  severity_on_fail: fatal
  reuses_factory_rule: factory.checks:rule_numeric_recompute
  description: Parses the arithmetic equality chains inside worked examples and numeric checks
    (hand-written parser, never eval) and recomputes them. Clean goldens must carry no blocking
    finding, and a planted contradiction (10 / 5 = 3) MUST be caught - proving the rule is not
    vacuously green. Reports checked/verified/unverifiable coverage counts.
- id: DET-SYN03-WAY-OUT
  entrypoint: evals.checkers.numeric_checks:check_numeric_way_out
  severity_on_fail: fatal
  reuses_factory_rule: factory.checks:rule_numeric_recompute
  description: Enforces the way-out contract - every finding the rule cannot prove (symbolic
    working, scientific notation, sqrt) is a minor whose message starts 'unverified:' and never a
    blocker. Reports the unverified rate; a unit conversion (0.5 h = 30 min) is not an arithmetic
    claim and must not be reported at all.
