  description: Real axe-core run (WCAG 2.2 AA tags) through headless Chromium when axe.min.js is
    resolvable locally (ZIVON_AXE_JS or a local axe-core install). Zero serious/critical required.
    SKIPPED - never reported as passing - when axe/Chromium is unavailable; the static engine above
    remains the always-on CI gate.
