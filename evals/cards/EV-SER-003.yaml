deterministic_checks:
- id: DET-SER03-COPY-SOURCE-COMPLIANCE
  entrypoint: evals.checkers.exam_checks:check_series_copy_compliance
  severity_on_fail: fatal
  reuses_factory_rule: factory.exam.validators:validate_series_manifest
  description: Compares every approved notice to docs/compliance/notices.md byte
    for byte, scans series labels/purpose/copy and every item prompt for forbidden
    paper claims (while accepting the approved negation "not an official CBSE
    paper"), and asserts the pack carries no verbatim or third-party item, that the
    Exact PYQ series is dark, and that every exported row's language is offered by
    the series it names. Three seeded defects (an "official CBSE paper" claim, the
    dark series switched on, a verbatim item in blueprint mode) must block publish.
