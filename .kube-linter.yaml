# kube-linter config used by CI (.github/workflows/ci.yml, manifests job).
checks:
  exclude:
    # kube-linter's "unsecrets" check wants secrets mounted as files, not env
    # vars. The factory reads its API key from the env var NAMED by config.json
    # (server.api_key_env), so env injection via Secret is the intended pattern.
    # Documented exemption — see docs/deployment/kubernetes.md.
    - unsecrets
