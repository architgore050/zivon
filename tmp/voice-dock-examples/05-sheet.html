<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dock mockup 05 · bottom sheet (throwaway)</title>
<!--
  ============================================================================
  THROWAWAY MOCKUP 05 - "bottom sheet, thumb-first"
  ----------------------------------------------------------------------------
  INERT AND VISUAL-ONLY: no WebSocket, no fetch, no CDN, no getUserMedia, no
  storage; all data fake (_dock.js). NOT design-doctrine §10.12 (§10.12 is
  founder-gated and absent, DCR-002). Reuses only existing §3-§6 /
  §10.1-§10.11 tokens. Backdrop = the real generated lesson page, unmodified.
  Collapsed = a 92 px thumb strip with the mic at the thumb corner; expanded
  = up to 60 % of the viewport, transcript history above the mic. The mic
  never moves out of thumb reach in either state.
  ============================================================================
-->
<link rel="stylesheet" href="_dock.css">
<style>
  /* ---- sheet --------------------------------------------------------- */
  .dk {
    left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column;
    border-width: 2px 0 0 0;
    max-height: 60dvh;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  /* grab handle: a real 44 px target, a 2 px ink rule with torn-paper look
     is not needed - the rule + the word IS the affordance */
  .dk-grab {
    flex: 0 0 auto;
    width: 100%;
    min-height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .45rem;
    border: 0;
    border-bottom: 1px solid var(--hair);
    background: transparent;
    color: var(--graphite);
    font-family: var(--notes);
    font-weight: 700;
    font-size: .75rem;
    letter-spacing: .05em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .dk-grab i {
    display: block;
    width: 44px;
    height: 2px;
    background: var(--ink);
  }
  .dk-grab svg { width: 13px; height: 13px; }
  .dk.is-collapsed .dk-grab svg { transform: rotate(180deg); }

  .dk-tr {
    order: 1;
    border-top: 0;
    border-bottom: 0;
    flex: 1 1 auto;
    min-height: 0;
    max-height: 34dvh;
  }
  .dk-note { order: 2; }
  .dk-text { order: 3; }
  .dk-top {                       /* mic row = the thumb shelf */
    order: 4;
    align-items: center;
    gap: .6rem;
    padding: 0.5rem 0.7rem 0.55rem;
    border-top: 1px solid var(--ink);
  }
  .dk-mic { width: 56px; height: 56px; }
  .dk-cap { font-size: 1rem; min-height: 1.35em; max-height: 4.05em; overflow: hidden; }
  .dk-chip { font-size: .6875rem; margin-bottom: 2px; }

  /* ---- collapsed: 92 px thumb strip ---------------------------------- */
  .dk.is-collapsed { max-height: 92px; }
  .dk.is-collapsed .dk-tr,
  .dk.is-collapsed .dk-note,
  .dk.is-collapsed .dk-text,
  .dk.is-collapsed .dk-chip,
  .dk.is-collapsed .dk-wait,
  .dk.is-collapsed .dk-think { display: none; }
  .dk.is-collapsed .dk-grab { min-height: 34px; border-bottom: 0; }
  .dk.is-collapsed .dk-top { border-top: 0; padding: 0.1rem 0.7rem 0.4rem; }
  .dk.is-collapsed .dk-cap {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    min-height: 0; max-height: 1.4em;
  }
  .dk.is-collapsed .dk-tools { gap: .25rem; }
  .dk.is-collapsed [data-grab-label] { font-size: 0; }
  .dk.is-collapsed [data-grab-label]::after {
    content: "Tap to open · mic ready";
    font-size: .75rem;
  }
  .dk.is-collapsed [data-texttoggle] { display: none; }

  @media (min-width: 900px) {
    .dk {
      left: max(0px, calc((100% - var(--page-w)) / 2 - 1.5rem));
      right: max(0px, calc((100% - var(--page-w)) / 2 - 1.5rem));
      border-width: 2px 2px 0 2px;
      max-height: 58dvh;
    }
    .dk.is-collapsed {
      left: auto;
      right: max(1rem, calc((100% - var(--page-w)) / 2 - 1.5rem));
      width: 420px;
      border-width: 2px 2px 0 2px;
    }
  }
</style>
</head>
<body data-variant="05-sheet">

<iframe class="stage"
        src="../../frontend/courses/class-11-physics/laws-of-motion/index.html#b-13"
        title="Laws of Motion - the real generated lesson page, anchored at block b-13"
        loading="eager"></iframe>

<aside class="dk" id="dock" data-state="idle" aria-label="Voice tutor dock">
  <button class="dk-grab" type="button" data-collapse aria-expanded="true" aria-label="Collapse the sheet to the thumb strip (mic stays available)">
    <i aria-hidden="true"></i>
    <span data-grab-label>Conversation</span>
    <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l4-4 4 4"></path></svg>
  </button>

  <div class="dk-top">
    <button class="dk-mic" data-mic type="button" aria-pressed="false" aria-label="Hold to talk">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2.5" width="6" height="11" rx="3"></rect>
        <path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"></path>
      </svg>
    </button>
    <div class="dk-live">
      <p class="dk-chip">
        <span class="dk-mark" aria-hidden="true"></span>
        <span data-chip>Mic idle</span>
        <span class="dk-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      </p>
      <p class="dk-cap" data-caption aria-live="polite" aria-atomic="true">Hold the mic and speak your doubt.</p>
      <div class="dk-wait" aria-hidden="true"></div>
      <div class="dk-think" aria-hidden="true"><span></span></div>
    </div>
    <div class="dk-tools">
      <button class="dk-btn" type="button" data-texttoggle aria-expanded="false" aria-controls="dk-text">Type</button>
    </div>
  </div>

  <ol class="dk-tr" data-transcript role="log" aria-live="polite" aria-label="Conversation"></ol>

  <p class="dk-note" data-note></p>

  <div class="dk-text" id="dk-text" data-textpanel>
    <form class="dk-form" data-form>
      <input class="dk-in" data-input type="text" placeholder="Apna doubt type karo…" aria-label="Type your Physics doubt" autocomplete="off">
      <button class="dk-send" type="submit">Send</button>
    </form>
  </div>
</aside>

<script src="_dock.js"></script>
</body>
</html>
