<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dock mockup 03 · margin rail (throwaway)</title>
<!--
  ============================================================================
  THROWAWAY MOCKUP 03 - "margin note" rail in the right page margin
  ----------------------------------------------------------------------------
  INERT AND VISUAL-ONLY: no WebSocket, no fetch, no CDN, no getUserMedia, no
  storage; all data is fake (_dock.js). NOT design-doctrine §10.12 (§10.12
  does not exist; founder-gated, DCR-002). Reuses only existing §3-§6 /
  §10.1-§10.11 tokens. Backdrop = the real generated lesson page, unmodified.
  The rail lives in the page's OUTER margin (outside the 47 rem column), so
  it never covers a word of the lesson. Below 1120 px that margin is gone and
  the rail becomes a bottom bar - that trade-off is the point of the variant.
  ============================================================================
-->
<link rel="stylesheet" href="_dock.css">
<style>
  /* ---- default (narrow): bottom bar, because the margin does not exist -- */
  .dk {
    left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    border-width: 2px 0 0 0;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .dk-top { padding: 0.55rem 0.8rem; }
  .dk-tr { order: -1; border-top: 0; border-bottom: 1px solid var(--ink); max-height: 6.5rem; }
  .dk.is-collapsed .dk-tr { display: none; }
  .dk.is-collapsed .dk-cap { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 0; }
  .dk-cap { max-height: 6.75em; overflow: hidden; }
  .dk-note { padding-top: .4rem; }
  .dk-form { padding-left: .8rem; padding-right: .8rem; }
  .dk-hand { display: none; }

  /* ---- wide: the rail. Column aligned to the page's ROW token: every
         block inside is a whole number of --row steps tall, top edge sits
         on a rule. -- */
  @media (min-width: 1120px) {
    .dk {
      bottom: auto;
      flex-direction: column;
      top: calc(var(--lb) + var(--row) * 1.5);
      left: calc((100vw - var(--page-w)) / 2 + var(--page-w) + 1.75rem);
      width: clamp(140px, calc((100vw - var(--page-w)) / 2 - 2.5rem), 236px);
      max-height: calc(100dvh - var(--lb) - var(--row) * 3);
      border-width: 2px;
      border-left-width: 3px;
      box-shadow: none;
    }
    .dk::before {
      /* the notebook margin rule the note hangs from: 2 px graphite, 40 % */
      content: "";
      position: absolute;
      left: -1.25rem;
      top: calc(var(--row) * -0.5);
      bottom: calc(var(--row) * -0.5);
      width: 2px;
      background: var(--hair);
    }
    .dk-top {
      flex-wrap: wrap;
      gap: .45rem .5rem;
      padding: calc(var(--row) / 2 - 1px) 0.6rem;
      align-items: flex-start;
    }
    .dk-mic { width: 44px; height: 44px; }
    .dk-live { flex: 1 1 100%; order: 3; padding-top: 0; }
    .dk-cap { font-size: 0.875rem; line-height: 1.35; min-height: 4.05em; max-height: 8.1em; }
    .dk-chip { font-size: 0.6875rem; }
    .dk-tools { order: 4; flex: 1 1 100%; justify-content: flex-start; }
    .dk-tools .dk-btn { min-height: 32px; font-size: .75rem; flex: 1 1 auto; }
    .dk-hand {
      display: block;
      order: 1;
      flex: 1 1 100%;
      margin: 0 0 .1rem;
      font-family: var(--hand);
      font-weight: 700;
      font-size: 1.125rem;
      line-height: 1.1;
      color: var(--pen-blue);
    }
    .dk-tr {
      order: 0;
      border-top: 1px solid var(--hair);
      border-bottom: 0;
      max-height: none;
      flex: 1 1 auto;
      min-height: calc(var(--row) * 2);
    }
    .dk-tr li { font-size: 0.8125rem; padding: calc(var(--row) / 4) 0.6rem; }
    .dk-tr .who { font-size: 0.9375rem; }
    .dk-note { font-size: 0.8125rem; padding: .4rem 0.6rem 0; }
    .dk-form { padding: .5rem 0.6rem; flex-wrap: wrap; }
    .dk-in { font-size: 0.875rem; min-height: 40px; }
    .dk-send { min-width: 100%; min-height: 40px; }
    .dk-text { order: 5; }

    /* collapsed = a 64 px sliver: mic + chevron only, still holdable */
    .dk.is-collapsed { width: 64px; max-height: none; }
    .dk.is-collapsed .dk-live,
    .dk.is-collapsed .dk-tr,
    .dk.is-collapsed .dk-note,
    .dk.is-collapsed .dk-text,
    .dk.is-collapsed .dk-hand { display: none; }
    .dk.is-collapsed .dk-top { padding: .5rem .35rem; justify-content: center; }
    .dk.is-collapsed .dk-tools { order: 0; flex: 0 0 auto; justify-content: center; }
    .dk.is-collapsed [data-texttoggle] { display: none; }
    .dk.is-collapsed [data-collapse] svg { transform: rotate(180deg); }
  }
</style>
</head>
<body data-variant="03-margin-rail">

<iframe class="stage"
        src="../../frontend/courses/class-11-physics/laws-of-motion/index.html#b-13"
        title="Laws of Motion - the real generated lesson page, anchored at block b-13"
        loading="eager"></iframe>

<aside class="dk" id="dock" data-state="idle" aria-label="Voice tutor dock">
  <div class="dk-top">
    <button class="dk-mic" data-mic type="button" aria-pressed="false" aria-label="Hold to talk">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2.5" width="6" height="11" rx="3"></rect>
        <path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"></path>
      </svg>
    </button>
    <div class="dk-live">
      <p class="dk-hand" aria-hidden="true">margin note</p>
      <p class="dk-chip">
        <span class="dk-mark" aria-hidden="true"></span>
        <span data-chip>Mic idle</span>
        <span class="dk-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      </p>
      <p class="dk-cap" data-caption aria-live="polite" aria-atomic="true">Hold the mic and speak your doubt.</p>
      <div class="dk-wait" aria-hidden="true"></div>
      <div class="dk-think" aria-hidden="true"><span></span></div>
    </div>
    <div class="dk-tools">
      <button class="dk-btn" type="button" data-texttoggle aria-expanded="false" aria-controls="dk-text">Type</button>
      <button class="dk-btn" type="button" data-collapse aria-expanded="true" aria-label="Collapse the dock (mic stays available)">
        <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l4-4 4 4"></path></svg>
        <span class="vh">Shrink dock</span>
      </button>
    </div>
  </div>

  <p class="dk-note" data-note></p>

  <div class="dk-text" id="dk-text" data-textpanel>
    <form class="dk-form" data-form>
      <input class="dk-in" data-input type="text" placeholder="Doubt type karo…" aria-label="Type your Physics doubt" autocomplete="off">
      <button class="dk-send" type="submit">Send</button>
    </form>
  </div>

  <ol class="dk-tr" data-transcript role="log" aria-live="polite" aria-label="Conversation"></ol>
</aside>

<script src="_dock.js"></script>
</body>
</html>
