# CodeQL: GitHub's static analysis engine — checks OUR Python code (not deps)
# for vulnerability patterns: injection, path traversal, unsafe deserialization...
# Free on public repos. Alerts appear inline on the PR and under Security → Code scanning.
name: Code scanning (CodeQL)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "30 3 * * 1"   # weekly deep scan: Mondays 03:30 UTC

permissions:
  contents: read
  security-events: write   # only job that may write scan results

jobs:
  analyze:
    name: Analyze Python code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: github/codeql-action/init@0fda7a646fd14a20daf520829ca1ae8847000819  # codeql-bundle-v2.27.3
        with:
          languages: python
      - uses: github/codeql-action/autobuild@0fda7a646fd14a20daf520829ca1ae8847000819
      - uses: github/codeql-action/analyze@0fda7a646fd14a20daf520829ca1ae8847000819
