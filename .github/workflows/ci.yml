# CI merge gate: every PR into main must pass ALL of these before it can merge
# (branch protection will require them by name). Runs again on merge to main.
#
# Hardening conventions used throughout:
#   - every third-party action pinned to a full commit SHA (tags can be retagged)
#   - top-level `permissions: {}` = GITHUB_TOKEN starts with ZERO powers;
#     each job grants only what it needs (least privilege)
name: CI merge gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}   # manual runs from the Actions tab

permissions: {}

jobs:
  # ---- 1. code quality -----------------------------------------------------
  quality:
    name: Lint + type check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install lint tools
        # Pinned on purpose (the same determinism rule as the torch wheel and
        # the SHA-pinned actions): an unpinned install let an upstream ruff
        # release silently change what the gate covers — 0.16 began formatting
        # Python blocks in Markdown — and redden main with no repo change.
        # Bump deliberately, after a local `ruff check . && ruff format --check .`
        # on the same version. Dependabot rotates requirements.txt, not CI pins.
        run: pip install ruff==0.17.4 mypy==2.4.1
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy type check
        run: |
          # Fixed core paths + guarded Wave-E extension paths: a package joins
          # the gate only once its directory exists, so a service landing
          # mid-wave cannot red the gate before its code exists — and needs
          # no further yml edit once it does (see cicd.md, path-guard rule).
          # The merge agent appends EX0's monolith package names (from its
          # manifest) to the candidate list below.
          paths=(factory docker pipeline.py testing)
          for candidate in voice logging_manager dashboard evals narration backend; do
            if [ -e "$candidate" ]; then paths+=("$candidate"); fi
          done
          mypy --ignore-missing-imports "${paths[@]}"

  # ---- 2. the image: lint, build, prove it works, scan it ------------------
  docker:
    name: Build image + smoke test + scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write      # only for uploading the SBOM artifact
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Dockerfile lint (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: Dockerfile
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build image (GitHub Actions layer cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          load: true                       # load into the runner's docker for the steps below
          tags: zivon-factory:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (the image's own CMD)
        run: docker run --rm zivon-factory:${{ github.sha }}
      - name: Pipeline CLI works inside the image
        run: docker run --rm zivon-factory:${{ github.sha }} python pipeline.py --help
      - name: Image vulnerability scan (trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: zivon-factory:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"                  # fail the PR on CRITICAL/HIGH with a fix available
          ignore-unfixed: true
      - name: Generate SBOM (what is inside this image)
        run: trivy image --format cyclonedx --output sbom.json zivon-factory:${{ github.sha }}
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: factory-sbom-${{ github.sha }}
          path: sbom.json

  # ---- 2b. the llm-manager node image: lint, build, prove it boots --------
  llm-manager-image:
    name: Build llm-manager image + smoke + scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Dockerfile lint (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: Dockerfile.llm-manager
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build node image (GitHub Actions layer cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile.llm-manager
          load: true                       # load into the runner's docker for the steps below
          tags: zivon-llm-manager:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (boots with config; /healthz answers with a dead upstream)
        run: |
          docker run -d --name llm-mgr -p 8000:8000 \
            -e ZIVON_BASE_URL=http://127.0.0.1:9/v1 -e ZIVON_MODEL=smoke-model \
            zivon-llm-manager:${{ github.sha }}
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8000/healthz > /dev/null; then exit 0; fi
            sleep 1
          done
          docker logs llm-mgr
          exit 1
      - name: Refuses to boot without config (no silent defaults)
        run: |
          if timeout 30 docker run --rm zivon-llm-manager:${{ github.sha }}; then
            echo "the node booted without config - it must refuse loudly"; exit 1
          fi
      - name: Image vulnerability scan (trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: zivon-llm-manager:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"                  # fail the PR on CRITICAL/HIGH with a fix available
          ignore-unfixed: true

  # ---- 2c. the frontend image: lint, build, prove it serves ---------------
  frontend-image:
    name: Frontend image build + smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Dockerfile lint (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: Dockerfile.frontend
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile.frontend
          load: true                       # load into the runner's docker for the steps below
          tags: zivon-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (site served, headers set, probe answers)
        run: |
          # The image stages the shell at /opt/zivon-shell; the served html root is a
          # volume/PVC in production (compose mount / seed-shell initContainer). Stand
          # in for the cluster path: writable root (tmpfs, uid 101 = the fsGroup stand-in)
          # seeded with the same no-clobber glob copy the initContainer uses (gotcha 6).
          # Without this the bare image serves nginx's default page and the shell checks
          # can never pass.
          docker run -d --name zivon-web -p 8080:8080 \
            --tmpfs /usr/share/nginx/html:rw,exec,uid=101,gid=101 \
            zivon-frontend:${{ github.sha }}
          for i in $(seq 1 15); do curl -sf http://127.0.0.1:8080/healthz >/dev/null && break; sleep 1; done
          docker exec zivon-web sh -c "cp -rn /opt/zivon-shell/* /usr/share/nginx/html/"
          curl -sf http://127.0.0.1:8080/healthz
          curl -sf http://127.0.0.1:8080/ | grep -q "Zivon"
          curl -sf http://127.0.0.1:8080/assets/zivon.css > /dev/null
          curl -sf http://127.0.0.1:8080/assets/zivon.js > /dev/null
          curl -sfI http://127.0.0.1:8080/ | grep -qi "content-security-policy"
          curl -sfI http://127.0.0.1:8080/ | grep -qi "x-content-type-options: nosniff"
          curl -sfI http://127.0.0.1:8080/ | grep -qi "cache-control: no-store"
          docker rm -f zivon-web
      - name: Image vulnerability scan (trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: zivon-frontend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"                  # fail the PR on CRITICAL/HIGH with a fix available
          ignore-unfixed: true

  # ---- 3. secrets: nothing sensitive may ever enter git history ------------
  secrets:
    name: Secret leak scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0                  # full history — gitleaks scans all commits
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---- 4. dependencies: known CVEs in the Python dependency tree -----------
  deps:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266  # v1.1.0
        with:
          req-file: requirements.txt

  # ---- 5. k8s manifests: valid schema + safe settings ----------------------
  manifests:
    name: Manifest validation (kubeconform + kube-linter)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: kubeconform — schema validity
        run: |
          # -f + retries: without them a transient 504 from GitHub's release CDN
          # downloads an HTML error page, tar chokes on it, and the step dies as a
          # bare "Process completed with exit code 2" naming nothing — that is what
          # reddened `manifests` on 3ae510b/5b93f3c while the manifests themselves
          # were valid (kubeconform + kube-linter pass on the same k8s/ tree).
          # Now the blip is retried, and a hard failure names the download.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz
          ./kubeconform -summary -strict -kubernetes-version 1.33.0 k8s/
      - name: kube-linter — security linting
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o kube-linter.tar.gz \
            https://github.com/stackrox/kube-linter/releases/download/v0.8.3/kube-linter-linux.tar.gz
          tar xzf kube-linter.tar.gz
          ./kube-linter lint --config .kube-linter.yaml k8s/

  # ---- 6. the actual test suites (content factory + frontend) ---------------
  tests:
    name: Tests (content factory + frontend)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Postgres 16 service container (backend-spec §12 CI row): the DB the
    # core-backend test set and the migration chain run against once EX0
    # lands. Reserved from day one so adding testing/backend needs no yml
    # edit and the merge gate never flaps on infra churn mid-wave. Key-free:
    # throwaway CI credentials, not product secrets.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zivon
          POSTGRES_PASSWORD: zivon
          POSTGRES_DB: zivon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zivon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Same throwaway value the db-migrations job uses; today's suites never
      # read it (they are key-free and offline) — the backend suite will.
      ZIVON_DB_URL: postgresql://zivon:zivon@127.0.0.1:5432/zivon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (torch CPU-only first, then the rest)
        # torch pinned to the same wheel the factory image installs (determinism
        # across CI tests and the shipped image)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0+cpu
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Content factory unit tests (fast, no network, no browser; embedder is a fixture)
        run: python -m unittest discover -s testing/content_factory/unit -t . -v
      - name: Content factory integration test (real orchestrator vs mock inference server + real headless Chromium)
        # first run downloads the all-MiniLM-L6-v2 embedder (~90 MB) from HuggingFace
        run: python -m unittest testing.content_factory.integration.test_end_to_end -v
      - name: Frontend shell + behaviour tests (headless Chromium)
        run: python -m unittest discover -s testing/frontend -t . -v
      - name: Wave-E test suites (each runs once its folder lands)
        # Same path-guard rule as the mypy extension: EX0-EX8 add the test
        # sets (testing/backend, testing/voice, testing/translation,
        # testing/narration, testing/observability, testing/logging_manager,
        # testing/evals) under the repo's unittest layout — this loop runs
        # each suite only when its folder exists, so a suite landing mid-wave
        # is covered automatically without another yml edit. Any suite
        # failure fails the job; the guard only skips ABSENT folders.
        run: |
          status=0
          for d in backend voice translation narration observability logging_manager evals; do
            if [ -d "testing/$d" ]; then
              echo "=== testing/$d ==="
              python -m unittest discover -s "testing/$d" -t . -v || status=1
            else
              echo "testing/$d not on this branch yet — reserved (path guard passes)"
            fi
          done
          exit $status

  # ---- 7. Wave-E reserved image gates ----------------------------------------
  # Path-guard doctrine (docs/deployment/cicd.md § Path guards): every new
  # service job below is written so it PASSES BEFORE the service exists —
  # a single guard step checks for the image's Dockerfile and the build/smoke/
  # scan steps run only when it landed. Adding a service therefore cannot red
  # the gate, and the day it lands its full gate activates with no yml edit.
  # Smoke pattern: docker/smoke_http_service.sh (boot-with-config -> healthz,
  # refuses-without-config — see the script header for the semantics).

  # ---- 7a. the core-backend monolith image (backend-spec §12 CI row) --------
  # voice/ has NO image of its own (ADR-0020): it mounts into this monolith,
  # so this one job gates both (mypy/pytest coverage comes from the quality
  # + tests guard loops above).
  backend-image:
    name: Core-backend image (guard = Dockerfile.backend)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: guard
        name: Path guard (green until EX0 lands Dockerfile.backend)
        run: |
          if [ -f Dockerfile.backend ]; then
            echo "landed=true" >> "$GITHUB_OUTPUT"
          else
            echo "landed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dockerfile.backend not on this branch yet - the core-backend image gate is reserved and green by design (backend-spec §12; wiring notes in docs/deployment/cicd.md)"
          fi
      - name: Dockerfile lint (hadolint)
        if: steps.guard.outputs.landed == 'true'
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: Dockerfile.backend
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        if: steps.guard.outputs.landed == 'true'
      - name: Build image (GitHub Actions layer cache)
        if: steps.guard.outputs.landed == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile.backend
          load: true                       # load into the runner's docker for the steps below
          tags: zivon-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (boot-with-config, /healthz; llm-manager pattern)
        # Boot contract assumption (adjust when EX0 lands the image): the
        # monolith boots with config env present even against a DEAD Postgres
        # (127.0.0.1:9) and answers /healthz - the smoke proves config wiring,
        # not DB connectivity (that is the db-migrations job's business).
        if: steps.guard.outputs.landed == 'true'
        run: |
          docker/smoke_http_service.sh \
            --image zivon-backend:${{ github.sha }} \
            --name zivon-backend-smoke \
            --port 18095:8000 \
            --boot-env ZIVON_DB_URL=postgresql://zivon:smoke@127.0.0.1:9/zivon \
            --boot-env ZIVON_ENV=dev
      - name: Refuses to boot without config (no silent defaults)
        if: steps.guard.outputs.landed == 'true'
        run: |
          docker/smoke_http_service.sh \
            --image zivon-backend:${{ github.sha }} \
            --refuse-without-config
      - name: Image vulnerability scan (trivy)
        if: steps.guard.outputs.landed == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: zivon-backend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"                  # fail the PR on CRITICAL/HIGH with a fix available
          ignore-unfixed: true

  # ---- 7b. the admin dashboard image (dashboard-spec §1 integration note I-2)
  # No refuse-without-config check BY SPEC: without its admin Secret the
  # dashboard still boots and /healthz answers (fail-closed happens per
  # request, 503 on admin routes + dashboard.auth_unconfigured).
  dashboard-image:
    name: Dashboard image (guard = Dockerfile.dashboard)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: guard
        name: Path guard (green until EX3 lands Dockerfile.dashboard)
        run: |
          if [ -f Dockerfile.dashboard ]; then
            echo "landed=true" >> "$GITHUB_OUTPUT"
          else
            echo "landed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dockerfile.dashboard not on this branch yet - the dashboard image gate is reserved and green by design (dashboard-spec §1 I-2; wiring notes in docs/deployment/cicd.md)"
          fi
      - name: Dockerfile lint (hadolint)
        if: steps.guard.outputs.landed == 'true'
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: Dockerfile.dashboard
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        if: steps.guard.outputs.landed == 'true'
      - name: Build image (GitHub Actions layer cache)
        if: steps.guard.outputs.landed == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile.dashboard
          load: true                       # load into the runner's docker for the steps below
          tags: zivon-dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (boots with fallback store, /healthz answers)
        if: steps.guard.outputs.landed == 'true'
        run: |
          docker/smoke_http_service.sh \
            --image zivon-dashboard:${{ github.sha }} \
            --name zivon-dashboard-smoke \
            --port 18096:8000 \
            --boot-env ZIVON_ENV=dev
      - name: Image vulnerability scan (trivy)
        if: steps.guard.outputs.landed == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: zivon-dashboard:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"                  # fail the PR on CRITICAL/HIGH with a fix available
          ignore-unfixed: true

  # ---- 7c. the migration chain (backend-spec §12: Alembic against a fresh DB)
  # Upgrade-from-empty proves the chain builds the schema with no hand steps.
  # Guard: the migration chain's location is EX0's choice (alembic.ini at
  # repo root, migrations/, or backend/) — the job runs whichever landed;
  # until then it is a reserved green gate.
  db-migrations:
    name: Alembic upgrade-from-empty (guard = migration chain)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zivon
          POSTGRES_PASSWORD: zivon
          POSTGRES_DB: zivon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zivon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ZIVON_DB_URL: postgresql://zivon:zivon@127.0.0.1:5432/zivon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: guard
        name: Path guard (green until EX0 lands the migration chain)
        run: |
          found=""
          for f in migrations/alembic.ini backend/alembic.ini alembic.ini; do
            if [ -f "$f" ]; then found="$f"; break; fi
          done
          echo "alembic_ini=$found" >> "$GITHUB_OUTPUT"
          if [ -n "$found" ]; then
            echo "landed=true" >> "$GITHUB_OUTPUT"
          else
            echo "landed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no alembic.ini yet - the migration gate is reserved and green by design (backend-spec §12; ADR-0016)"
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        if: steps.guard.outputs.landed == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        if: steps.guard.outputs.landed == 'true'
        # requirements.txt first (the monolith's own pins); alembic + the DB
        # driver come from it once EX0 lands the chain. Adjust this install
        # with EX0's manifest if the migration env needs more.
        run: pip install -r requirements.txt
      - name: Upgrade from empty, twice (idempotent second run)
        if: steps.guard.outputs.landed == 'true'
        run: |
          cd "$(dirname "${{ steps.guard.outputs.alembic_ini }}")"
          alembic upgrade head
          alembic upgrade head      # second run must be a no-op (no drift)
          # Schema drift gate: alembic check exits nonzero when the models and
          # the migrations disagree. Availability is probed FIRST so an older
          # alembic skips loudly — never by masking a real nonzero exit.
          if alembic check --help > /dev/null 2>&1; then
            alembic check
          else
            echo "::warning::alembic check unavailable in this alembic version - drift gate skipped, upgrade EX0's pin"
          fi

  # ---- 7d. evals deterministic smoke (EX4 spec §5.1, verbatim command) --------
  # PR-gate subset: the DETERMINISTIC checkers only (no judge model calls —
  # the suite must run key-free like every other gate). The full eval suite
  # (judges + calibration) stays in-cluster on the k8s/52 CronJob cadence.
  evals-smoke:
    name: Evals deterministic smoke (guard = evals package)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: guard
        name: Path guard (green until EX4 lands the evals package)
        run: |
          if [ -f evals/__main__.py ]; then
            echo "landed=true" >> "$GITHUB_OUTPUT"
          else
            echo "landed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::evals/ not on this branch yet - the eval smoke gate is reserved and green by design (evals spec §5.1; starts gating on real regressions the moment the package lands)"
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        if: steps.guard.outputs.landed == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        if: steps.guard.outputs.landed == 'true'
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0+cpu
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run deterministic eval smoke suite on golden sets
        if: steps.guard.outputs.landed == 'true'
        run: python -m evals run --suite smoke --fail-on-regression
