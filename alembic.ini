# Alembic configuration for Zivon core backend (ADR-0016).
# ONE linear migration chain, two version directories (see version_locations):
# EX0's baseline in alembic/versions (0001 -> 0002) and EX2's Class-C3
# translation revision in migrations/versions (0022, down_revision = "0002").
# `alembic heads` must print exactly one head.

[alembic]
script_location = alembic
version_locations = alembic/versions migrations/versions
prepend_sys_path = .
version_path_separator = space
sqlalchemy.url = postgresql://zivon:zivon@localhost:5432/zivon

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
